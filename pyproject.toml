[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C4", "C90", "RET", "PTH", "RUF", "N", "T20"]
# RUF001-003 flag Cyrillic as look-alike Latin, and the bot's user-facing texts are in Russian.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]
